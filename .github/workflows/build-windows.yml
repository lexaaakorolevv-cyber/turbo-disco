name: Build Windows x64

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cube-learner-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test and build Geode mod
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cube-learner-windows-x64
          path: |
            build/windows-x64/local.cube_learner.geode
            build/windows-x64/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
